# Inventario de todo lo que sabe el asistente.
# Guía §6.1. Cada entrada necesita: id único, type, mode, tenant, title.

embedding_model: embeddinggemma
chunk_size: 800
chunk_overlap: 120

sources:
  # ---------- Tipo A: se indexa ----------
  - id: ejemplo-calendario
    type: file
    path: corpus/ejemplo.txt
    title: Calendario académico (EJEMPLO)
    tenant: universidad
    vigencia: 2027-01-01
    mode: index

  # Sitio institucional cosechado con `npm run crawl`.
  # Los .md tienen frontmatter (url, title, fetched_at) para poder citar.
  - id: frrq-web
    type: dir
    path: corpus/web
    title: Sitio web FRRQ UTN
    tenant: universidad
    mode: index

  # FAQ importada del bot de Dialogflow (`npm run import:df`).
  # Cada documento es una unidad pregunta -> respuesta autocontenida.
  - id: faq-dialogflow
    type: dir
    path: corpus/faq
    title: Preguntas frecuentes del bot
    tenant: universidad
    mode: index

