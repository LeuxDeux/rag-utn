# PDF que se convierten a corpus/pdf/*.md con `npm run import:pdf`.
#
# Son los de alto valor de corpus/web/_pdfs.json (guía §17.3): reglamentos, diseños curriculares,
# planes de estudio y correlatividades. Quedan afuera los formularios en blanco (F-003, F-050,
# solicitudes de concurso, NO-DOCENTE-*), el plano de JTENSF y la plantilla de CTE2025: no tienen
# conocimiento que responder, y la página que los enlaza ya explica el trámite. También el plan viejo
# de la TUP (Ord. 1299), reemplazado por el plan 2024 (Ord. 2018), para que no se contradigan, y el
# Plan-de-Estudio-TUP-2022.pdf, que el sitio ya no tiene (404). Y PlanEstudioTUHST.pdf: su tabla de
# tres columnas con filas partidas sale ilegible y el diseño curricular (Ord. 986) tiene lo mismo.
#
# Los escaneados (sin capa de texto) se pasan por OCR una vez con src/tools/ocr-pdf-windows.ps1;
# el texto queda en corpus/pdf-ocr/ y import:pdf lo usa.
#
# Para sumar uno: agregar url y title (doc_id se deriva del nombre del archivo: pdf-<nombre>).
# Para sacarlo: borrar la entrada y volver a correr el import (borra el .md).

pdfs:
  # Reglamentos de estudio
  # Las copias del sitio de la Facultad de estas ordenanzas son escaneos sin texto: se usa la del
  # Consejo Superior (csu.rec.utn.edu.ar), que es la publicación oficial.
